<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1f3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainingskarten">
<title>Trainingskarten</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font: 16px/1.45 "Segoe UI", system-ui, sans-serif; background: #0b1f3f; color: #fff;
         display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 24px 16px; }
  main { width: 100%; max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 14px 0 4px; }
  p { margin: 0 0 20px; color: #b9c6dc; font-size: 14px; }
  form { display: grid; gap: 10px; }
  input { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
          background: rgba(255,255,255,.08); color: #fff; width: 100%; }
  input:focus { outline: 2px solid #c9a13b; outline-offset: 1px; }
  button { font: 600 16px/1 inherit; padding: 13px; border: 0; border-radius: 10px; background: #c9a13b; color: #0b1f3f; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .meldung { min-height: 1.4em; font-size: 14px; color: #ffb4a8; margin: 4px 0 0; }
  .merken { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: #b9c6dc; }
  .merken input { width: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Trainingskarten</h1>
  <p id="info">Übungs- und Wissenskarten – bitte Passwort eingeben.</p>
  <form id="form" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" required autofocus>
    <button type="submit" id="los">Öffnen</button>
    <div class="meldung" id="meldung" role="alert"></div>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById('form'), pw = document.getElementById('pw'),
      los = document.getElementById('los'), meldung = document.getElementById('meldung'), info = document.getElementById('info');

  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle || !window.indexedDB) {
    info.textContent = 'Dieser Browser wird nicht unterstützt (bitte aktuellen Chrome, Safari, Firefox oder Edge über https verwenden).';
    return;
  }

  function db() {
    return new Promise(function (ok, fehler) {
      var r = indexedDB.open('wissen', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('k'); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { fehler(r.error); };
    });
  }
  function dbTx(modus, tun) {
    return db().then(function (d) {
      return new Promise(function (ok, fehler) {
        var t = d.transaction('k', modus), r = tun(t.objectStore('k'));
        t.oncomplete = function () { ok(r && r.result); };
        t.onerror = function () { fehler(t.error); };
      });
    });
  }
  var holen = function (n) { return dbTx('readonly', function (s) { return s.get(n); }); };
  var setzen = function (n, v) { return dbTx('readwrite', function (s) { return s.put(v, n); }); };
  var loeschen = function (n) { return dbTx('readwrite', function (s) { return s.delete(n); }); };

  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

  var registrierung = navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; });

  function weiter() {
    return registrierung.then(function (r) {
      if (r.active) r.active.postMessage('neu');
      location.replace('app/uebersicht.html' + location.hash);
    });
  }

  var abmelden = /[?&]abmelden\b/.test(location.search);
  (abmelden ? loeschen('key').then(function () { history.replaceState(null, '', location.pathname); return registrierung; })
            .then(function (r) { if (r.active) r.active.postMessage('neu'); return null; })
            : holen('key'))
    .then(function (key) { if (key) return weiter(); form.hidden = false; pw.focus(); })
    .catch(function () { form.hidden = false; });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    los.disabled = true; meldung.textContent = ''; los.textContent = 'Wird geprüft …';
    var key;
    fetch('schluessel.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
      .then(function (k) {
        return crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveBits'])
          .then(function (basis) {
            return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(k.salz), iterations: k.iterationen }, basis, 512);
          });
      })
      .then(function (bits) {
        return crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-GCM' }, false, ['decrypt']);
      })
      .then(function (k) { key = k; return fetch('e/index.bin', { cache: 'no-cache' }); })
      .then(function (r) { if (!r.ok) throw new Error('netz'); return r.arrayBuffer(); })
      .then(function (buf) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12))
          .catch(function () { throw new Error('passwort'); });
      })
      .then(function () { return setzen('key', key); })
      .then(weiter)
      .catch(function (e) {
        los.disabled = false; los.textContent = 'Öffnen';
        meldung.textContent = e && e.message === 'passwort' ? 'Falsches Passwort.' : 'Keine Verbindung – bitte später erneut versuchen.';
        pw.select();
      });
  });
})();
</script>
</body>
</html>
